<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <title>Blue portfolio</title>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header__inner">
        <div class="header__top-header">
          <img class="header__logo" src="img/WD.svg" alt="Logo">
          <div class="header__menu">
            <ul>
              <li>Главная</li>
              <li>Об авторе</li>
              <li>Работы</li>
              <li>Процесс</li>
              <li>Контакты</li>
            </ul>
          </div>
        </div>
        <div class="header__flex">
          <div class="header__notebook">
            <img src="img/notebook.png" alt="Notebook">
          </div>
          <div class="header__right-col">
            <h1 class="header__h1">Дизайн и верстка</h1>
            <p class="header__p">Lorem Ipsum - это текст-"рыба", часто используемый в печати и вэб-дизайне. Lorem Ipsum является стандартной "рыбой" для текстов на латинице с начала XVI века.</p>
            <button class="header__button button">Написать мне</button>
          </div>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
